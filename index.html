<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>위험물 반응식 카드</title>
<style>
:root{--bg:#FFF7F0;--front:#FFE6A7;--back:#B8EAD9;--pink:#FFB5C8;--sky:#BCDCFF;--ink:#5A4A5F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);
 background-image:radial-gradient(#FFD9E3 1.5px,transparent 1.5px);background-size:22px 22px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{text-align:center;font-size:1.4rem;margin:4px 0}
.sub{text-align:center;font-size:.85rem;opacity:.7}
.stat{text-align:center;margin:8px 0 12px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;color:var(--ink);cursor:pointer}
.tabs button.on{background:var(--pink)}
.scene{perspective:1000px;height:270px;cursor:pointer;user-select:none;touch-action:pan-y}
.card{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:28px;
 display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;box-shadow:0 7px 0 var(--ink);overflow:auto}
.front{background:var(--front)}.back{background:var(--back);transform:rotateY(180deg)}
.tag{font-size:.78rem;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;margin-bottom:12px}
.mark{position:absolute;top:14px;right:16px;font-size:1.3rem}
.name{font-size:1.75rem;font-weight:800;word-break:keep-all}
.q{margin-top:8px}
.eq{font-size:1.2rem;font-weight:700;line-height:1.7;word-break:keep-all}
.desc{font-size:.85rem;margin-top:8px}
.memo{font-size:.82rem;margin-top:10px;background:#fff;border-radius:12px;padding:6px 10px;white-space:pre-wrap;max-width:100%}
.btn{border:3px solid var(--ink);border-radius:18px;padding:11px;font-size:1rem;font-weight:700;color:var(--ink);cursor:pointer;box-shadow:0 4px 0 var(--ink);background:var(--sky)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:10px;margin-top:16px;align-items:center}.row .btn{flex:1}
.chk.on{background:var(--pink)}
.count{min-width:70px;text-align:center;font-weight:700}
.small{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.small button{border:2px dashed var(--ink);background:#fff;border-radius:999px;padding:8px 14px;color:var(--ink);cursor:pointer;font-size:.9rem}
.small button.on{background:var(--pink);border-style:solid}
.empty{display:none;text-align:center;padding:60px 10px;border:3px dashed var(--ink);border-radius:28px;background:#fff}
.modal{position:fixed;inset:0;background:rgba(90,74,95,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.show{display:flex}
.sheet{background:var(--bg);width:100%;max-width:560px;border:3px solid var(--ink);border-radius:28px 28px 0 0;padding:20px}
.sheet h3{margin:0 0 12px}
.sheet label{display:block;font-size:.85rem;margin:10px 0 4px}
.sheet input,.sheet select,.sheet textarea{width:100%;border:2px solid var(--ink);border-radius:12px;padding:10px;font-size:1rem;font-family:inherit;color:var(--ink);background:#fff}
.sheet textarea{min-height:110px;resize:vertical}
.help{font-size:.75rem;opacity:.7;margin-top:4px}
.del{background:#fff}
.hint{text-align:center;font-size:.78rem;opacity:.6;margin-top:16px}
@media(min-width:768px){.modal{align-items:center}.sheet{border-radius:28px}.scene{height:330px}.name{font-size:2.2rem}.eq{font-size:1.45rem}h1{font-size:1.8rem}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧪 위험물 반응식 카드 🐣</h1>
  <div class="sub">카드를 누르면 뒤집혀요</div>
  <div class="stat" id="stat"></div>
  <div class="tabs" id="tabs"></div>

  <div class="scene" id="scene">
    <div class="card" id="card">
      <div class="face front"><span class="mark" id="mark"></span><span class="tag" id="tagF"></span><div class="name" id="name"></div><div class="q" id="q"></div></div>
      <div class="face back"><span class="tag" id="tagB"></span><div class="eq" id="eq"></div><div class="desc" id="desc"></div><div class="memo" id="memoView"></div></div>
    </div>
  </div>
  <div class="empty" id="empty">여기엔 아직 카드가 없어요 🐣</div>

  <div class="row"><button class="btn chk" id="ok">😊 외웠어요</button><button class="btn chk" id="ng">🤔 헷갈려요</button></div>
  <div class="row"><button class="btn" id="prev">◀ 이전</button><span class="count" id="count"></span><button class="btn" id="next">다음 ▶</button></div>
  <div class="small">
    <button id="shuffle">🔀 섞기</button><button id="memoBtn">📝 메모</button><button id="addBtn">➕ 카드 추가</button>
    <button id="hideBtn">🙈 외운 카드 숨기기</button><button id="delBtn" style="display:none">🗑 이 카드 삭제</button><button id="resetBtn">↺ 기록 초기화</button>
  </div>
  <div class="hint">PC: ← → 이동 · 스페이스 뒤집기 / 휴대폰: 카드를 좌우로 밀어서 이동</div>
</div>

<div class="modal" id="memoModal"><div class="sheet">
  <h3>📝 메모</h3><div id="memoFor"></div>
  <textarea id="memoText" placeholder="외우는 요령, 헷갈리는 점 등을 적어 보세요"></textarea>
  <div class="row"><button class="btn del" data-close>취소</button><button class="btn" id="memoSave">저장</button></div>
</div></div>

<div class="modal" id="addModal"><div class="sheet">
  <h3>➕ 카드 추가</h3>
  <label>분류</label><select id="aCat"><option>연소</option><option>물과 반응</option><option>분해</option><option>산·기타</option></select>
  <label>물질 이름</label><input id="aName" placeholder="예: 황린">
  <label>질문 (비우면 분류에 맞게 자동)</label><input id="aQ" placeholder="예: 연소 반응식은?">
  <label>반응식</label><input id="aEq" placeholder="예: P4 + 5O2 → 2P2O5">
  <div class="help">숫자는 그냥 쓰면 아래첨자로 바뀌어요. 화살표는 -> 로 써도 돼요</div>
  <label>설명 (선택)</label><input id="aDesc" placeholder="예: 포스핀 발생">
  <div class="help" id="aErr" style="color:#c0395b"></div>
  <div class="row"><button class="btn del" data-close>취소</button><button class="btn" id="addSave">저장</button></div>
</div></div>

<div class="modal" id="confirmModal"><div class="sheet">
  <h3 id="cTitle"></h3><div id="cMsg"></div>
  <div class="row"><button class="btn del" data-close>취소</button><button class="btn" id="cOk">확인</button></div>
</div></div>

<script>
const Q={"연소":"연소 반응식은?","물과 반응":"물과의 반응식은?","분해":"분해 반응식은?","산·기타":"반응식은?"};
const RAW={
"연소":[["황","S + O2 → SO2"],["삼황화인","P4S3 + 8O2 → 2P2O5 + 3SO2"],["오황화인","2P2S5 + 15O2 → 2P2O5 + 10SO2"],["칠황화인","P4S7 + 12O2 → 2P2O5 + 7SO2"],["황린","P4 + 5O2 → 2P2O5"],["적린","4P + 5O2 → 2P2O5"],["메탄","CH4 + 2O2 → CO2 + 2H2O"],["에탄","2C2H6 + 7O2 → 4CO2 + 6H2O"],["프로판","C3H8 + 5O2 → 3CO2 + 4H2O"],["부탄","2C4H10 + 13O2 → 8CO2 + 10H2O"],["메탄올","2CH3OH + 3O2 → 2CO2 + 4H2O"],["에탄올","C2H5OH + 3O2 → 2CO2 + 3H2O"],["아세트산","CH3COOH + 2O2 → 2CO2 + 2H2O"],["아세톤","CH3COCH3 + 4O2 → 3CO2 + 3H2O"],["메틸에틸케톤","2CH3COC2H5 + 11O2 → 8CO2 + 8H2O"],["이황화탄소","CS2 + 3O2 → CO2 + 2SO2","청색 불꽃"],["아세틸렌","2C2H2 + 5O2 → 4CO2 + 2H2O"],["트리에틸알루미늄","2(C2H5)3Al + 21O2 → Al2O3 + 12CO2 + 15H2O"],["알루미늄","4Al + 3O2 → 2Al2O3"],["마그네슘","2Mg + O2 → 2MgO"],["철","4Fe + 3O2 → 2Fe2O3"],["나트륨","4Na + O2 → 2Na2O"],["히드라진","N2H4 + O2 → N2 + 2H2O"],["메탄올 (산화)","2CH3OH + O2 → 2HCHO + 2H2O","포름알데히드 생성"]],
"물과 반응":[["칼륨","2K + 2H2O → 2KOH + H2","수소 발생"],["나트륨","2Na + 2H2O → 2NaOH + H2","수소 발생"],["리튬","2Li + 2H2O → 2LiOH + H2","수소 발생"],["수소화나트륨","NaH + H2O → NaOH + H2","수소 발생"],["수소화칼륨","KH + H2O → KOH + H2","수소 발생"],["수소화칼슘","CaH2 + 2H2O → Ca(OH)2 + 2H2","수소 발생"],["수소화알루미늄리튬","LiAlH4 + 4H2O → LiOH + Al(OH)3 + 4H2","수소 발생"],["트리메틸알루미늄","(CH3)3Al + 3H2O → Al(OH)3 + 3CH4","메탄 발생"],["트리에틸알루미늄","(C2H5)3Al + 3H2O → Al(OH)3 + 3C2H6","에탄 발생"],["인화칼슘","Ca3P2 + 6H2O → 3Ca(OH)2 + 2PH3","포스핀 발생"],["인화알루미늄","AlP + 3H2O → Al(OH)3 + PH3","포스핀 발생"],["탄화칼슘","CaC2 + 2H2O → Ca(OH)2 + C2H2","아세틸렌 발생"],["탄화알루미늄","Al4C3 + 12H2O → 4Al(OH)3 + 3CH4","메탄 발생"],["과산화나트륨","2Na2O2 + 2H2O → 4NaOH + O2","산소 발생"],["과산화칼륨","2K2O2 + 2H2O → 4KOH + O2","산소 발생"],["마그네슘","Mg + 2H2O → Mg(OH)2 + H2","수소 발생"],["알루미늄","2Al + 6H2O → 2Al(OH)3 + 3H2","수소 발생"]],
"분해":[["아염소산나트륨","NaClO2 → NaCl + O2"],["염소산칼륨","2KClO3 → 2KCl + 3O2","정촉매: 이산화망간"],["과염소산나트륨","NaClO4 → NaCl + 2O2"],["과염소산칼륨","KClO4 → KCl + 2O2"],["과산화나트륨","2Na2O2 → 2Na2O + O2"],["질산칼륨","2KNO3 → 2KNO2 + O2"],["질산암모늄","2NH4NO3 → 2N2 + O2 + 4H2O","ANFO 화약"],["질산","4HNO3 → 2H2O + 4NO2 + O2","갈색병 보관"],["과산화수소","2H2O2 → 2H2O + O2","촉매 MnO2"],["니트로글리세린","4C3H5(ONO2)3 → 12CO2 + 10H2O + 6N2 + O2"],["트리니트로톨루엔","2C6H2(NO2)3CH3 → 2C + 3N2 + 5H2 + 12CO"]],
"산·기타":[["아염소산나트륨","3NaClO2 + 4Al → 2Al2O3 + 3NaCl","","알루미늄과의 반응식은?"],["아염소산나트륨","5NaClO2 + 4HCl → 4ClO2 + 5NaCl + 2H2O","","염산과의 반응식은?"],["염소산칼륨","6KClO3 + 3H2SO4 → 2HClO4 + 4ClO2 + 3K2SO4 + 2H2O","","황산과의 반응식은?"],["과산화나트륨","Na2O2 + 2HCl → H2O2 + 2NaCl","","염산과의 반응식은?"],["과산화나트륨","2Na2O2 + 2CO2 → 2Na2CO3 + O2","","이산화탄소와의 반응식은?"],["구리","3Cu + 8HNO3 → 3Cu(NO3)2 + 2NO + 4H2O","","묽은 질산과의 반응식은?"],["구리","Cu + 4HNO3 → Cu(NO3)2 + 2NO2 + 2H2O","","진한 질산과의 반응식은?"],["오황화인","P2S5 + 8H2O → 5H2S + 2H3PO4","황화수소 발생","물과의 반응식은?"],["적린","6P + 5KClO3 → 3P2O5 + 5KCl","","염소산칼륨과의 반응식은?"],["오산화인","P2O5 + 3H2O → 2H3PO4","","물과의 반응식은?"],["철","Fe + 2HCl → FeCl2 + H2","","염산과의 반응식은? (염화철Ⅱ)"],["알루미늄","2Al + 6HCl → 2AlCl3 + 3H2","","염산과의 반응식은?"],["마그네슘","2Mg + CO2 → 2MgO + C","","이산화탄소와의 반응식은?"],["칼륨","2K + 2C2H5OH → 2C2H5OK + H2","","에탄올과의 반응식은?"],["칼륨","4K + 3CO2 → 2K2CO3 + C","","이산화탄소와의 반응식은?"],["트리에틸알루미늄","(C2H5)3Al + 3CH3OH → (CH3O)3Al + 3C2H6","","메탄올과의 반응식은?"],["황린","P4 + 3KOH + 3H2O → 3KH2PO2 + PH3","","수산화칼륨과의 반응식은?"],["아세틸렌","C2H2 + 2Cu → Cu2C2 + H2","","구리와의 반응식은?"],["아세톤","CH3COCH3 + 3I2 + 4NaOH → CH3COONa + CHI3 + 3NaI + 3H2O","황색 침전","아이오딘포름 반응식은?"],["톨루엔","C6H5CH3 + 3HNO3 → C6H2CH3(NO2)3 + 3H2O","","TNT 생성 반응식은?"],["철","2Fe + 6HCl → 2FeCl3 + 3H2","","염산과의 반응식은? (염화철Ⅲ)"],["마그네슘","Mg + 2HCl → MgCl2 + H2","","염산과의 반응식은?"],["마그네슘","Mg + CO2 → MgO + CO","","이산화탄소와의 반응식은? (일산화탄소 생성)"],["나트륨","2Na + 2C2H5OH → 2C2H5ONa + H2","","에탄올과의 반응식은?"],["탄화알루미늄","Al4C3 + 12HCl → 4AlCl3 + 3CH4","","염산과의 반응식은?"],["아세트알데하이드","2CH3CHO + O2 → 2CH3COOH","아세트산 생성","산화 반응식은?"],["아세트산","2CH3COOH + Na2O2 → 2CH3COONa + H2O2","","과산화나트륨과의 반응식은?"],["과산화수소","2H2O2 + N2H4 → 4H2O + N2","","히드라진과의 반응식은?"],["에틸렌","C2H4 + PdCl2 + H2O → CH3CHO + Pd + 2HCl","","아세트알데하이드 생성 반응식은? (염화팔라듐)"],["에틸렌","2C2H4 + O2 → 2CH3CHO","","아세트알데하이드 생성 반응식은? (산소)"],["에탄올","2C2H5OH → C2H5OC2H5 + H2O","진한황산 사용","다이에틸에터 생성 반응식은?"]]
};
const BASE=[];
for(const c in RAW)RAW[c].forEach((r,k)=>BASE.push({id:"b-"+c+"-"+k,cat:c,name:r[0],eq:r[1],desc:r[2]||"",q:r[3]||Q[c]}));

const KEY="hzCards.v1";
let S={marks:{},memos:{},mine:[],pos:{tab:"전체",id:null},hide:false};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s)S=Object.assign(S,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const TABS=["전체","연소","물과 반응","분해","산·기타","헷갈려요","내가 만든 카드"];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sub=s=>esc(s).replace(/([A-Za-z\)])(\d+)/g,"$1<sub>$2</sub>");
const all=()=>BASE.concat(S.mine);
let list=[],i=0;

function build(keepId){
  const t=S.pos.tab;
  list=all().filter(c=>t==="전체"||(t==="헷갈려요"?S.marks[c.id]==="ng":t==="내가 만든 카드"?c.mine:c.cat===t));
  if(S.hide&&t!=="헷갈려요")list=list.filter(c=>S.marks[c.id]!=="ok");
  i=Math.max(0,list.findIndex(c=>c.id===keepId));
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t===t));
  show();
}
function show(){
  const c=list[i],has=!!c;
  $("scene").style.display=has?"":"none";$("empty").style.display=has?"none":"block";
  $("count").textContent=has?(i+1)+" / "+list.length:"0 / 0";
  const okN=all().filter(x=>S.marks[x.id]==="ok").length;
  $("stat").textContent="😊 외웠어요 "+okN+" / 전체 "+all().length;
  $("hideBtn").classList.toggle("on",S.hide);
  if(!has){$("delBtn").style.display="none";["ok","ng"].forEach(k=>$(k).classList.remove("on"));return}
  S.pos.id=c.id;save();
  $("card").classList.remove("flip");
  setTimeout(()=>{
    $("tagF").textContent=$("tagB").textContent=c.cat+(c.mine?" · 내 카드":"");
    $("name").textContent=c.name;$("q").textContent=c.q;
    $("eq").innerHTML=sub(c.eq);$("desc").textContent=c.desc;
    const m=S.memos[c.id];$("memoView").style.display=m?"":"none";$("memoView").textContent=m?"📝 "+m:"";
    $("mark").textContent=S.marks[c.id]==="ok"?"😊":S.marks[c.id]==="ng"?"🤔":"";
  },150);
  $("ok").classList.toggle("on",S.marks[c.id]==="ok");$("ng").classList.toggle("on",S.marks[c.id]==="ng");
  $("delBtn").style.display=c.mine?"":"none";
}
function mark(k){const c=list[i];if(!c)return;S.marks[c.id]===k?delete S.marks[c.id]:S.marks[c.id]=k;save();
  const t=S.pos.tab;if((t==="헷갈려요"&&k==="ng")||(S.hide&&k==="ok"))build(list[i+1]?list[i+1].id:null);else show()}
const go=d=>{if(!list.length)return;i=(i+d+list.length)%list.length;show()};
const open=id=>$(id).classList.add("show");
const closeAll=()=>document.querySelectorAll(".modal").forEach(m=>m.classList.remove("show"));
let cAction=null;
function ask(title,msg,fn){$("cTitle").textContent=title;$("cMsg").textContent=msg;cAction=fn;open("confirmModal")}

$("tabs").innerHTML=TABS.map(t=>`<button data-t="${t}">${t}</button>`).join("");
$("tabs").onclick=e=>{const t=e.target.dataset.t;if(t){S.pos.tab=t;save();build()}};
$("scene").onclick=()=>{if(!moved)$("card").classList.toggle("flip")};
$("next").onclick=()=>go(1);$("prev").onclick=()=>go(-1);
$("ok").onclick=()=>mark("ok");$("ng").onclick=()=>mark("ng");
$("shuffle").onclick=()=>{for(let k=list.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[list[k],list[j]]=[list[j],list[k]]}i=0;show()};
$("hideBtn").onclick=()=>{S.hide=!S.hide;save();build(list[i]&&list[i].id)};
$("memoBtn").onclick=()=>{const c=list[i];if(!c)return;$("memoFor").textContent=c.name+" · "+c.q;$("memoText").value=S.memos[c.id]||"";open("memoModal")};
$("memoSave").onclick=()=>{const c=list[i],v=$("memoText").value.trim();v?S.memos[c.id]=v:delete S.memos[c.id];save();closeAll();show()};
$("addBtn").onclick=()=>{["aName","aQ","aEq","aDesc"].forEach(k=>$(k).value="");$("aErr").textContent="";open("addModal")};
$("addSave").onclick=()=>{
  const name=$("aName").value.trim(),eq=$("aEq").value.trim().replace(/->/g,"→"),cat=$("aCat").value;
  if(!name||!eq){$("aErr").textContent="물질 이름과 반응식은 꼭 적어 주세요";return}
  const c={id:"m-"+Date.now(),cat,name,eq,desc:$("aDesc").value.trim(),q:$("aQ").value.trim()||Q[cat],mine:true};
  S.mine.push(c);S.pos.tab="내가 만든 카드";save();closeAll();build(c.id)};
$("delBtn").onclick=()=>{const c=list[i];ask("🗑 카드 삭제","'"+c.name+"' 카드를 지울까요? 메모와 체크도 같이 지워져요.",()=>{
  S.mine=S.mine.filter(x=>x.id!==c.id);delete S.marks[c.id];delete S.memos[c.id];save();build(list[i+1]?list[i+1].id:null)})};
$("resetBtn").onclick=()=>ask("↺ 기록 초기화","외웠어요/헷갈려요 체크와 메모를 모두 지울까요? 내가 만든 카드는 남아요.",()=>{S.marks={};S.memos={};save();build(list[i]&&list[i].id)});
$("cOk").onclick=()=>{closeAll();cAction&&cAction()};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeAll);
document.querySelectorAll(".modal").forEach(m=>m.onclick=e=>{if(e.target===m)closeAll()});
document.onkeydown=e=>{if(document.querySelector(".modal.show")){if(e.key==="Escape")closeAll();return}
  if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1);if(e.key===" "){e.preventDefault();$("card").classList.toggle("flip")}};
let sx=0,moved=false;
$("scene").addEventListener("touchstart",e=>{sx=e.touches[0].clientX;moved=false},{passive:true});
$("scene").addEventListener("touchend",e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50){moved=true;go(dx<0?1:-1);setTimeout(()=>moved=false,350)}});

if(!TABS.includes(S.pos.tab))S.pos.tab="전체";
build(S.pos.id);
</script>
</body>
</html>
